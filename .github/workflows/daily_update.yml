name: 每日看板更新

on:
  schedule:
    # 每天北京时间早上 7:00（UTC 23:00）
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: '全量重爬（忽略缓存）'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行每日更新
        run: |
          cd 央行货币政策看板_融合版
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            python daily_update.py --full
          else
            python daily_update.py
          fi

      - name: 提交数据更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles_cache.json pipeline_report.json app/
          git diff --staged --quiet || git commit -m "每日更新: $(date +%Y-%m-%d)"
          git push

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传看板到 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
